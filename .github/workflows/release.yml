name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: the menu bar app needs swift build.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser only builds the Go CLI; the Swift app is assembled here and
      # picked up by the archive's `files` glob (Coffee.app/** at repo root).
      - name: Build Coffee.app (universal)
        run: |
          cd macos
          swift build -c release --arch arm64 --arch x86_64
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)

          # Info.plist + ad-hoc codesign live in bundle.sh, shared with run.sh
          # so local dev builds get the same bundle.
          ./bundle.sh "$BIN_DIR/coffee-menubar" "${GITHUB_REF_NAME#v}" ../Coffee.app

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
