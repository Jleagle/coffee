name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Require a v* tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::This workflow must run on a v* tag, not '$GITHUB_REF_NAME'. Re-run it from a tag."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go CLI (universal)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/coffee-cli-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/coffee-cli-amd64 .
          lipo -create -output dist/coffee dist/coffee-cli-arm64 dist/coffee-cli-amd64
          rm dist/coffee-cli-arm64 dist/coffee-cli-amd64

      - name: Build menu bar app (universal, Coffee.app bundle)
        run: |
          cd macos
          swift build -c release --arch arm64 --arch x86_64
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)

          VERSION="${GITHUB_REF_NAME#v}"
          APP="../dist/Coffee.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_DIR/coffee-menubar" "$APP/Contents/MacOS/coffee-menubar"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Coffee</string>
            <key>CFBundleDisplayName</key><string>Coffee</string>
            <key>CFBundleIdentifier</key><string>com.jleagle.coffee</string>
            <key>CFBundleExecutable</key><string>coffee-menubar</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature so the assembled bundle is coherent (arm64 requires
          # at least an ad-hoc signature to launch).
          codesign --force --sign - "$APP"

      - name: Package
        id: package
        run: |
          cd dist
          ARCHIVE="coffee-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -czf "$ARCHIVE" coffee Coffee.app
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          # Idempotent: if the release already exists (created via the GitHub UI,
          # or by an earlier run that failed at a later step), attach/refresh the
          # asset instead of failing. Otherwise create it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$ARCHIVE" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Jleagle/homebrew-coffee.git" tap
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p tap/Casks
          cat > tap/Casks/coffee.rb <<EOF
          # This file is regenerated by the release workflow in Jleagle/coffee on every
          # tagged release — do not edit the url/sha256 by hand.
          #
          # Install (upgrading from the old formula: \`brew services stop coffee &&
          # brew uninstall coffee\` first):
          #   brew install --cask Jleagle/coffee/coffee
          cask "coffee" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/Jleagle/coffee/releases/download/${GITHUB_REF_NAME}/${ARCHIVE}"
            name "Coffee"
            desc "Coffee shop CLI and macOS menu bar app"
            homepage "https://github.com/Jleagle/coffee"

            depends_on macos: :ventura

            app "Coffee.app"
            binary "coffee"

            # Quit the running app before an upgrade/uninstall replaces it.
            uninstall quit: "com.jleagle.coffee"

            # The app is ad-hoc signed, not notarized, so Gatekeeper would block
            # the quarantined download on first launch — strip the attribute
            # from the installed app and the staged CLI binary instead. Then
            # (re)launch, so an upgrade restarts the app.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Coffee.app"],
                             must_succeed: false
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", staged_path.to_s],
                             must_succeed: false
              system_command "/usr/bin/open",
                             args: ["-a", "#{appdir}/Coffee.app"],
                             must_succeed: false
            end
          end
          EOF
          cd tap
          # The cask replaces the old formula (which ran the app via brew services).
          git rm -f --ignore-unmatch Formula/coffee.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/coffee.rb
          # Skip the commit/push when a re-run regenerates an identical cask,
          # so retrying the workflow doesn't fail on "nothing to commit".
          if git diff --cached --quiet; then
            echo "Cask unchanged — nothing to push."
          else
            git commit -m "coffee ${GITHUB_REF_NAME}"
            git push origin main
          fi
