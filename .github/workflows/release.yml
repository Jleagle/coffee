name: Release

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release, e.g. v1.2.3"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    # The menu bar app needs swift build.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Info.plist + ad-hoc codesign live in bundle.sh, shared with run.sh so
      # local dev builds get the same bundle.
      - name: Build Coffee.app (universal)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          ./bundle.sh "$BIN_DIR/coffee-menubar" "${TAG#v}" Coffee.app

      - name: Package
        id: package
        run: |
          VERSION="${TAG#v}"
          ARCHIVE="coffee_${VERSION}_darwin_all.tar.gz"
          CHECKSUMS="coffee_${VERSION}_checksums.txt"
          tar -czf "$ARCHIVE" Coffee.app
          shasum -a 256 "$ARCHIVE" | tee "$CHECKSUMS"
          {
            echo "archive=$ARCHIVE"
            echo "checksums=$CHECKSUMS"
            echo "sha256=$(cut -d' ' -f1 "$CHECKSUMS")"
          } >> "$GITHUB_OUTPUT"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" --clobber \
            "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.checksums }}"

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Jleagle/homebrew-coffee.git" tap
          ./cask.sh "${TAG#v}" "$SHA256" > tap/Casks/coffee.rb
          cd tap
          git add Casks/coffee.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coffee to ${TAG#v}"
          git push
