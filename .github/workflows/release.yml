name: Release

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release, e.g. v1.2.3"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The same build the formula runs on the user's machine.
      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # Brew builds Coffee.app from GitHub's source tarball for the tag, so
      # there are no binaries to attach to the release.
      - name: Render the formula
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256="$(curl -fsSL --retry 3 "$URL" | shasum -a 256 | cut -d' ' -f1)"
          ./homebrew/formula.sh "${TAG#v}" "$SHA256" > coffee.rb
          cat coffee.rb

      - name: Checkout the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: Jleagle/homebrew-coffee
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew tap
        run: |
          mkdir -p tap/Formula tap/Casks
          cp coffee.rb tap/Formula/coffee.rb
          cp homebrew/cask.rb tap/Casks/coffee.rb
          cd tap
          git add Formula/coffee.rb Casks/coffee.rb
          if git diff --cached --quiet; then
            echo "Tap already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coffee to ${TAG#v}"
          git push
